<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Editorial Children’s Books Redesign Prototype for We Love Reading (welovereading.org) — Bilingual English LTR & Arabic RTL."
  />
  <title>We Love Reading — Children’s Books</title>

  <!-- Editorial & Arabic Google Fonts (graceful system fallbacks if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css?v=20261118j" />
</head>
<body>
  <a href="#app-stage" class="sr-only">Skip to Children’s Books content</a>

  <!-- Editorial Navigation Header -->
  <header id="site-header" class="site-header"></header>

  <!-- Dynamic Prototype View Stage -->
  <main id="app-stage" class="view-stage" tabindex="-1"></main>

  <!-- Minimal Prototype Footer -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- Inline PDF Reader Modal (Used only when valid source PDFs exist) -->
  <div
    id="pdf-modal"
    class="pdf-modal"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="pdf-modal-title"
  >
    <div class="pdf-modal-dialog">
      <div class="pdf-modal-bar">
        <h2 id="pdf-modal-title" class="pdf-modal-title">PDF Reader</h2>
        <button type="button" id="pdf-modal-close" class="lang-btn">
          Close Reader
        </button>
      </div>
      <iframe id="pdf-modal-frame" class="pdf-modal-frame" title="PDF Document Viewer" src="about:blank"></iframe>
    </div>
  </div>

  <script src="js/data.js?v=20261118j"></script>
  <script src="js/app.js?v=20261118j"></script>
</body>
</html>
